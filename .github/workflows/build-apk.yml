name: Build Android app

# Runs when a version tag like v0.1 is pushed (or by hand from the Actions tab),
# builds the APK in the cloud and attaches it to that tag's Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Put the game inside the app
        run: |
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www

      - name: Get the signing key from the repository secrets
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: echo "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/fnafsiege.p12"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
          SIGNING_KEY_FILE: ${{ runner.temp }}/fnafsiege.p12
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "FNAF-Siege-${{ github.ref_name }}.apk"

      - name: Attach to the Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --title "FNAF Siege ${{ github.ref_name }}" --notes "Download the .apk below on your phone and open it to install."
          gh release upload "${{ github.ref_name }}" "FNAF-Siege-${{ github.ref_name }}.apk" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: FNAF-Siege-apk
          path: FNAF-Siege-*.apk
